<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space observatory | Standalone SVG viewer</title>
    <link rel="stylesheet" href="/dev/theme.css" />
    <script type="module" src="/dev/theme.ts"></script>
    <style>
      body {
        margin: 0;
        font: 16px/1.6 system-ui;
        background: var(--md-default-bg-color);
        color: var(--md-default-fg-color);
      }
      header,
      article {
        max-width: 1000px;
        margin: auto;
        padding: 24px;
      }
      article > svg {
        display: block;
        max-width: 100%;
        height: auto;
      }
      a {
        color: var(--md-accent-fg-color);
      }
    </style>
    <script defer src="/dist/svg-viewer.js"></script>
  </head>
  <body>
    <header>
      <button id="theme-toggle" type="button">Switch to dark mode</button>
      <button id="navigate" type="button">Simulate instant navigation</button>
    </header>
    <article class="md-content__inner md-typeset"></article>
    <script type="module">
      import { overviewContent, processingContent } from '/dev/diagrams.ts';
      const article = document.querySelector('article');
      article.innerHTML = overviewContent;
      document.querySelector('#navigate').addEventListener('click', () => {
        article.innerHTML = processingContent;
      });
    </script>
  </body>
</html>
