<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TechDocs &amp; MkDocs SVG viewer demo</title>
    <link rel="stylesheet" href="/dev/theme.css" />
    <script type="module" src="/dev/theme.ts"></script>
    <style>
      body {
        margin: 0;
        font: 16px/1.6 system-ui;
        background: var(--demo-page-background);
        color: var(--md-default-fg-color);
      }
      header,
      main {
        max-width: 980px;
        margin: auto;
        padding: 24px;
      }
      header p {
        color: var(--md-default-fg-color--light);
      }
      #docs {
        display: block;
        background: var(--md-default-bg-color);
        padding: 24px;
        border-radius: 12px;
      }
      h1 {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <header class="demo-controls">
      <h1>TechDocs &amp; MkDocs SVG viewer</h1>
      <p>
        A local demo using the same viewer controller inside a shadow DOM. Open
        the diagram, then try its links, zoom and pan controls.
      </p>
      <button id="theme-toggle" type="button">Switch to dark mode</button>
      <button id="replace">Simulate a TechDocs page change</button>
      <button id="dispose">Remove addon</button>
      <button id="install">Install addon</button>
    </header>
    <main><div id="docs"></div></main>
    <script type="module" src="/dev/main.ts"></script>
  </body>
</html>
