<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVG viewer example</title>
    <!-- Run pnpm build from the repository root, then open this file. -->
    <script defer src="../../dist/svg-viewer.js"></script>
  </head>
  <body>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 300 120"
      width="300"
      height="120"
    >
      <title>Example diagram</title>
      <rect width="300" height="120" fill="#edf4ff" />
      <text x="150" y="65" text-anchor="middle">Click to expand</text>
    </svg>
  </body>
</html>
