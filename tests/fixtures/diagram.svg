<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="architecture" viewBox="-20 -20 840 360" width="840" height="360" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Order processing architecture</title>
  <desc id="diagram-desc">API gateway sends orders to the order service, which uses PostgreSQL and publishes events to the queue.</desc>
  <defs>
    <linearGradient id="node-fill" x2="0" y2="1"><stop stop-color="#edf4ff"/><stop offset="1" stop-color="#dce9ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7888a3"/></marker>
  </defs>
  <g fill="none" stroke="#7888a3" stroke-width="2" marker-end="url(#arrow)">
    <path d="M200 140 H285"/><path d="M485 140 H570"/><path d="M385 180 V255 H570"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">
    <a href="https://backstage.io/" target="_blank" rel="noopener noreferrer" aria-label="Open Backstage documentation">
      <rect x="10" y="100" width="190" height="80" rx="12" fill="url(#node-fill)" stroke="#8ca9d8"/>
      <text x="105" y="145" class="node-label">API gateway ↗</text>
    </a>
    <a xlink:href="/guide/?from=diagram#orders" aria-label="Read order service guide">
      <rect x="285" y="100" width="200" height="80" rx="12" fill="url(#node-fill)" stroke="#8ca9d8"/>
      <text x="385" y="145" class="node-label">Order service</text>
    </a>
    <rect x="570" y="100" width="210" height="80" rx="12" fill="#e6f4ec" stroke="#8dbba4"/>
    <text x="675" y="145" class="node-label">PostgreSQL</text>
    <a href="#queue-note" aria-label="Jump to queue note">
      <rect x="570" y="220" width="210" height="70" rx="12" fill="#fff3da" stroke="#d3b97c"/>
      <text x="675" y="262" class="node-label">Event queue ↓</text>
    </a>
    <text x="400" y="40" font-size="24" font-weight="600" fill="#192338">Order processing</text>
  </g>
</svg>
