<rect x="40" y="160" width="280" height="110" rx="12" fill="#fff5e8" stroke="#b16a22" stroke-width="2"/>
<text x="56" y="198" font-size="22" fill="#192f4b" font-weight="650">Raw exposures →</text>
<text x="56" y="228" font-size="16" fill="#334155" >Uncalibrated detector data</text>
<text x="56" y="250" font-size="16" fill="#334155" >with observation metadata</text>
</a>
