<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="processing" viewBox="-20 -20 1240 880" width="1240" height="880" role="img" aria-labelledby="processing-title processing-desc">
<title id="processing-title">Calibration and quality review</title>
<desc id="processing-desc">Raw exposures and versioned reference files feed calibration. Imaging and spectroscopy use different processing branches. Quality assessment records flags, uncertainties and provenance alongside products. Raw exposures are archived independently, and can be reprocessed with updated software or references.</desc>
<defs><marker id="processing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect x="-20" y="-20" width="1240" height="880" rx="18" fill="#ffffff"/>
<g font-family="system-ui, sans-serif">
<text x="30" y="45" font-size="16" fill="#b16a22" letter-spacing="2">SCIENCE PROCESSING / SELECTED DATA FLOWS</text>
<text x="30" y="88" font-size="32" fill="#192f4b" font-weight="700">Calibration and quality review</text>
<text x="30" y="124" font-size="18" fill="#334155" >The observing mode selects the processing branch. Raw data remain available for reprocessing.</text>
<g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#processing-arrow)"><path d="M320 215H432"/><path d="M840 215H728"/><path d="M550 270V330H270V382"/><path d="M610 270V330H930V382"/><path d="M270 510V565H500V612"/><path d="M930 510V565H660V612"/><path d="M720 675H832"/><path d="M40 215H12V790H1180V675H1128"/></g>
