<text x="690" y="319" font-size="17" fill="#334155" >Spectroscopy</text>
<text x="733" y="658" font-size="15" fill="#334155" >With flags</text>
<text x="390" y="782" font-size="17" fill="#334155" >Retain raw products independently of calibration</text>
