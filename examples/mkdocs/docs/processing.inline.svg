<text x="456" y="228" font-size="16" fill="#334155" >Detector corrections and</text>
<text x="456" y="250" font-size="16" fill="#334155" >instrument-mode calibration</text>
</a>
<g>
<rect x="840" y="160" width="280" height="110" rx="12" fill="#fff5e8" stroke="#b16a22" stroke-width="2"/>
