site_name: SVG viewer fixture
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
plugins:
  # Backstage adds techdocs-core during generation. Loading it here would
  # clear the Material palette in the standalone preview.
  - search
  - inline-select-svg:
      pattern: '[.]inline[.]svg$'
# Only used outside Backstage; TechDocs strips <script> tags and the addon
# takes over. Copy dist/svg-viewer.js here first or use the jsDelivr CDN
# (see README.md).
extra_javascript:
  - javascripts/svg-viewer.js
