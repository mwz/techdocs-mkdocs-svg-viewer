name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # Keep this version in sync with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --init --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24', 'node']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm format:check
      - name: Check on matrix Node version
        run: |
          node --version
          pnpm exec playwright --version
          pnpm check
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results-node-${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore

  backstage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm example:backstage:setup
      - run: pnpm example:mkdocs:test
      - run: pnpm example:backstage:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm example:backstage:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backstage-browser-results
          path: test-results/backstage/
          if-no-files-found: ignore

  publish:
    # A `v*` tag stages a release; a push to main stages a snapshot with the
    # `next` dist-tag. A manual run on main always stages a snapshot. npm
    # trusted publishing (OIDC) authenticates the job, so no npm token is
    # stored. The trusted publisher allows only `npm stage publish`: a staged
    # version stays private until a maintainer approves it on npmjs.com with
    # 2FA. Set the repository variable NPM_PUBLISH to `true` after the trusted
    # publisher is configured on npmjs.com.
    needs: [check, backstage]
    if: >-
      vars.NPM_PUBLISH == 'true' && (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref ==
      'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    concurrency:
      group: publish-${{ github.ref }}
    permissions:
      contents: write # Create the GitHub release for a tag.
      id-token: write # npm trusted publishing and provenance.
    steps:
      # Pinned to the commits of the tags that the check job uses.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # `npm stage` needs npm 11.15.0 or later. Node 24 can include an older npm.
      - run: npm install --global npm@11.21.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Choose version and dist-tag
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME is not on main."
              exit 1
            fi
            # GitHub shows each line break in release notes, so unwrap the
            # CHANGELOG lines.
            awk -v heading="## $version" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md |
              pnpm exec prettier --stdin-filepath release-notes.md --prose-wrap never > "$RUNNER_TEMP/release-notes.md"
            if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
              echo "::error::CHANGELOG.md has no '## $version' section."
              exit 1
            fi
            if [[ "$version" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # Skip the snapshot if nothing that goes into the package changed.
            # A manual run has no previous commit, so it always continues.
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null &&
              git diff --quiet "$BEFORE" "$GITHUB_SHA" -- src package.json tsconfig.json tsup.config.ts; then
              echo "No package changes since $BEFORE. Skipping the snapshot."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # The next patch version with a prerelease suffix, for example
            # 0.2.1-main.42.gabc1234, sorts after the current release. The `g`
            # prefix stops a SHA of only digits from becoming a numeric
            # identifier with a leading zero, which semver rejects.
            next_patch=$(node -p "const [major, minor, patch] = '$version'.split('-')[0].split('.').map(Number); [major, minor, patch + 1].join('.')")
            version="$next_patch-main.$GITHUB_RUN_NUMBER.g${GITHUB_SHA::7}"
            npm version "$version" --no-git-tag-version
            dist_tag=next
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - run: pnpm build
        if: steps.version.outputs.skip != 'true'
      - name: Stage on npm
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: |
          name=$(node -p "require('./package.json').name")
          # npm view prints nothing for a version that is not published yet.
          # Skipping a published version lets the first release, which is
          # published by hand, still get a GitHub release. npm view cannot see
          # a staged version, so a rerun after staging fails: the version is
          # already taken.
          if [[ -n "$(npm view "$name@$VERSION" version 2>/dev/null)" ]]; then
            echo "$name@$VERSION is already published. Skipping."
          else
            npm stage publish --tag "$DIST_TAG"
            echo "::notice::Staged $name@$VERSION. Approve it in the Staged Packages tab on npmjs.com."
          fi
      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists. Skipping."
            exit 0
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/svg-viewer.js \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"
