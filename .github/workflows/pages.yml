name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEMO_BASE_URL: https://mwz.github.io/techdocs-mkdocs-svg-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm example:backstage:setup
      - run: pnpm example:backstage-demo:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm example:backstage-demo:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backstage-demo-browser-results
          path: test-results/backstage-demo/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if:
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: examples/backstage/packages/demo/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
