allowBuilds:
  # Pulled in by @techdocs/cli. Its Docker, SSH and keychain support is not
  # used: the example runs `serve:mkdocs --no-docker`.
  core-js: false
  cpu-features: false
  esbuild: true
  keytar: false
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@backstage/catalog-model@1.10.2'
  - '@backstage/config@1.3.10'
  - '@backstage/core-components@0.18.15'
  - '@backstage/core-plugin-api@1.12.11'
  - '@backstage/errors@1.3.2'
  - '@backstage/filter-predicates@0.2.0'
  - '@backstage/frontend-plugin-api@0.18.2'
  - '@backstage/plugin-permission-common@0.9.12'
  - '@backstage/plugin-techdocs-common@0.1.2'
  - '@backstage/plugin-techdocs-react@1.4.0'
  - '@backstage/ui@0.19.0'
